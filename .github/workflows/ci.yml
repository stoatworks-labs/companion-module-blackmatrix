name: ci

# The smoke test is the check worth having: it imports the module's real source,
# which pulls in @companion-module/base and ws for real, so a dependency bump
# that breaks them fails here rather than on someone's rack at a show.
#
# `npm run package` is here too, and is not redundant: it is the ONLY check that
# catches an entrypoint or manifest break — a module can pass every unit test and
# still be impossible to install.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json pins engines.node to ^22.20; matching it here means the
          # check runs on the same major Companion itself ships.
          node-version: 22
          cache: npm

      # Deliberately a plain `npm ci` — no --legacy-peer-deps. A bump that only
      # installs by ignoring the peer graph is exactly what this is here to catch.
      - run: npm ci

      - run: npm test

      - run: npm run package

      # Packaging succeeding is not the same as the package being loadable. What
      # Companion (and Burrow) look for is package.json in the archive's root
      # directory, and release.yml once shipped an archive that had it a level
      # deeper. Assert the shape here, where a PR can go red for it.
      - name: Check the package is loadable
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # No pipes below, deliberately. `tar tzf "$f" | head -n 1` makes tar die
          # of SIGPIPE the moment head has its line, and under pipefail that fails
          # the step for a package that is perfectly good. Whether it loses the
          # race depends on the listing size, so it passed on two of fifteen
          # siblings and went red on the rest.
          files=(*.tgz)
          [ ${#files[@]} -gt 0 ] || { echo "::error::companion-module-build produced no .tgz"; exit 1; }
          f=${files[0]}
          list=$(tar tzf "$f")
          first=${list%%$'\n'*}
          root=${first%%/*}
          for want in "$root/package.json" "$root/companion/manifest.json"; do
            case $'\n'"$list"$'\n' in
              *$'\n'"$want"$'\n'*) ;;
              *) echo "::error::$f has no $want, so Companion would not load it"; exit 1 ;;
            esac
          done
          echo "$f: ok — root is $root/"
